<title>Madhouse Standard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy sidebar + scrolling work area; tables and cards on a blue-tinted neutral ground. */
:root {
  --navy: #0e2a47; --navy-2: #173c62; --navy-ink: #dce8f4; --navy-muted: #8fa9c4;
  --sky: #4fa3db; --accent: #1f6fb2; --accent-ink: #ffffff; --accent-soft: #e3eff9;
  --bg: #f2f5f8; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #14202e; --muted: #5a6a7b; --line: #dbe3eb; --line-2: #c7d3df;
  --minor: #23804f; --minor-soft: #e5f3ea; --major: #d06614; --major-soft: #fcefe3; --critical: #b82a26; --critical-soft: #fbeceb;
  --p1: #3d1a8a; --p2: #6a43c6; --p3: #9c86da; --p4: #cdc3ec; --p-ink-dark: #ffffff; --p-ink-light: #22164a;
  --warn: #a4660a; --warn-soft: #fdf4e1; --ok: #23804f;
  --shadow: 0 1px 2px rgba(14, 42, 71, .06), 0 2px 8px rgba(14, 42, 71, .05);
  --f-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --navy: #071624; --navy-2: #10283f; --navy-ink: #d6e3f0; --navy-muted: #7f97b0;
  --sky: #6ab7ea; --accent: #5aaee6; --accent-ink: #06121e; --accent-soft: #14304a;
  --bg: #0b1520; --surface: #111f2e; --surface-2: #162739; --ink: #e2e9f1; --muted: #93a4b6; --line: #243649; --line-2: #2f4560;
  --minor: #3fae72; --minor-soft: #12301f; --major: #ee8a3a; --major-soft: #3a2412; --critical: #ef5d56; --critical-soft: #3d1715;
  --p1: #d3c6fb; --p2: #a993ee; --p3: #7c64c8; --p4: #54468a; --p-ink-dark: #160d33; --p-ink-light: #f0ecff;
  --warn: #f0b44c; --warn-soft: #33270f; --ok: #3fae72;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --navy: #071624; --navy-2: #10283f; --navy-ink: #d6e3f0; --navy-muted: #7f97b0;
  --sky: #6ab7ea; --accent: #5aaee6; --accent-ink: #06121e; --accent-soft: #14304a;
  --bg: #0b1520; --surface: #111f2e; --surface-2: #162739; --ink: #e2e9f1; --muted: #93a4b6; --line: #243649; --line-2: #2f4560;
  --minor: #3fae72; --minor-soft: #12301f; --major: #ee8a3a; --major-soft: #3a2412; --critical: #ef5d56; --critical-soft: #3d1715;
  --p1: #d3c6fb; --p2: #a993ee; --p3: #7c64c8; --p4: #54468a; --p-ink-dark: #160d33; --p-ink-light: #f0ecff;
  --warn: #f0b44c; --warn-soft: #33270f; --ok: #3fae72;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .nowrap { white-space: nowrap; }
.r { text-align: right; }
.spacer { flex: 1; }
.ico { flex: none; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--navy); color: var(--navy-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; height: 100dvh; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.mark { display: grid; grid-template-columns: repeat(3, 6px); gap: 3px; align-items: end; height: 28px; }
.mark span { background: var(--sky); width: 6px; border-radius: 1px; }
.mark span:nth-child(1) { height: 14px; } .mark span:nth-child(2) { height: 28px; background: #fff; } .mark span:nth-child(3) { height: 20px; }
.brand-text b { display: block; font-family: var(--f-display); font-weight: 800; letter-spacing: .16em; font-size: 17px; color: #fff; }
.brand-text span { display: block; font-family: var(--f-display); font-weight: 600; letter-spacing: .32em; font-size: 10.5px; color: var(--sky); }
.nav-toggle { display: none; margin-left: auto; color: #fff; }
.side nav { display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; flex: 1; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: 0; background: none; border-radius: var(--r); color: var(--navy-ink); text-align: left; cursor: pointer; font-weight: 500; font-size: 13.5px; }
.nav-item:hover { background: rgba(255,255,255,.06); }
.nav-item.on { background: var(--navy-2); color: #fff; box-shadow: inset 3px 0 0 var(--sky); }
.nav-item .ico { color: var(--navy-muted); } .nav-item.on .ico { color: var(--sky); }
.nav-alert { margin-left: auto; font-style: normal; background: var(--critical); color: #fff; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
.side-foot { padding: 14px 20px 18px; font-size: 11px; color: var(--navy-muted); display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,.08); }
.wm { font-size: 11px; letter-spacing: .02em; opacity: .85; }
.main { min-width: 0; display: flex; flex-direction: column; padding-right: env(safe-area-inset-right, 0px); }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 22px 28px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top h1 { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.user-chip { display: flex; flex-direction: column; align-items: flex-end; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 6px 12px; cursor: pointer; text-align: right; }
.user-chip b { font-size: 13px; } .user-chip span { font-size: 11.5px; color: var(--muted); }
.page { padding: 22px 28px 28px; flex: 1; min-width: 0; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 28px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }

/* Banners */
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r); font-size: 13px; margin: 0 0 12px; }
.main > .banner { margin: 14px 28px 0; }
.banner-warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.banner-warn .ico { color: var(--warn); }
.banner-crit { background: var(--critical-soft); border: 1px solid var(--critical); color: var(--ink); }
.banner-crit .ico { color: var(--critical); }
.banner .btn { margin-left: auto; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.disclaimer { font-size: 11.5px; color: var(--muted); border-left: 3px solid var(--line-2); padding: 4px 10px; margin: 8px 0 0; max-width: 90ch; }

/* Buttons and controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 13px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn-danger-ghost { color: var(--critical); border-color: var(--critical); background: transparent; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn.full { width: 100%; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; padding: 6px; border-radius: var(--r); cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.danger:hover { color: var(--critical); }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding: 7px 10px; min-height: 36px; }
textarea { resize: vertical; min-height: 60px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[readonly] { background: var(--surface-2); color: var(--muted); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar-right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; min-width: 150px; max-width: 100%; flex: 0 1 auto; }
.count { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.search { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding: 0 10px; flex: 1 1 280px; max-width: 460px; color: var(--muted); }
.search input { border: 0 !important; box-shadow: none !important; padding-left: 0; background: transparent; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg-opt { border: 0; background: transparent; padding: 7px 13px; cursor: pointer; font-size: 13px; color: var(--ink); border-right: 1px solid var(--line); }
.seg-opt:last-child { border-right: 0; }
.seg-opt:hover:not(:disabled) { background: var(--surface-2); }
.seg-opt.on { background: var(--navy); color: #fff; }
.seg-opt.on-danger { background: var(--critical); }
.seg-opt.on-warn { background: var(--warn); color: #1a1205; }
.seg-opt:disabled { color: var(--line-2); cursor: not-allowed; }
.check { display: inline-flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }

/* Cards and layout */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 14px; font-weight: 700; letter-spacing: .01em; margin-bottom: 12px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.card-head h3 { margin: 0; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.chip-hi { background: var(--accent-soft); border-color: var(--accent); }
.chip-sample { background: var(--warn-soft); border-color: var(--warn); font-size: 10px; letter-spacing: .06em; font-weight: 700; padding: 0 5px; }

/* Badges: classification = filled, priority = outlined tag with number */
.cls { display: inline-block; font-family: var(--f-display); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding: 3px 9px; border-radius: 4px; color: #fff; }
.cls.sm { font-size: 10.5px; padding: 2px 7px; }
.cls-minor { background: var(--minor); } .cls-major { background: var(--major); color: #fff; } .cls-critical { background: var(--critical); }
.prio { display: inline-flex; align-items: stretch; font-size: 11.5px; border: 1.5px solid var(--p2); border-radius: 4px; overflow: hidden; white-space: nowrap; }
.prio b { font-family: var(--f-mono); padding: 1px 6px; color: var(--p-ink-dark); }
.prio span { padding: 1px 8px; color: var(--ink); background: var(--surface); }
.prio.sm b { padding: 0 6px; }
.prio-P1 { border-color: var(--p1); } .prio-P1 b { background: var(--p1); }
.prio-P2 { border-color: var(--p2); } .prio-P2 b { background: var(--p2); }
.prio-P3 { border-color: var(--p3); } .prio-P3 b { background: var(--p3); color: var(--p-ink-light); }
.prio-P4 { border-color: var(--p4); } .prio-P4 b { background: var(--p4); color: var(--p-ink-light); }
.status { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line-2); }
.st-pending { background: var(--warn-soft); border-color: var(--warn); }
.st-open { background: var(--accent-soft); border-color: var(--accent); }
.st-warn { background: var(--major-soft); border-color: var(--major); }
.st-done { background: var(--minor-soft); border-color: var(--minor); }
.pass { color: var(--minor); font-weight: 700; } .fail { color: var(--critical); font-weight: 700; }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); }

/* KPIs and charts */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line-2); }
.kpi-minor::before { background: var(--minor); } .kpi-major::before { background: var(--major); } .kpi-critical::before { background: var(--critical); } .kpi-prio::before { background: var(--p2); }
.kpi-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi-value { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-sub { font-size: 11.5px; color: var(--muted); }
.grid-charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.chart { position: relative; }
.chart-note { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }
.empty-chart { color: var(--muted); font-size: 12.5px; padding: 18px 0; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 5; transform: translateY(-100%); }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.donut { width: 150px; height: 150px; flex: none; }
.donut path { stroke: var(--surface); stroke-width: 2; }
.donut-n { font-family: var(--f-display); font-weight: 700; font-size: 26px; fill: var(--ink); }
.donut-l { font-size: 11px; fill: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; flex: 1; min-width: 140px; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto 36px; gap: 8px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: block; }
.legend.inline { flex-direction: row; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; font-size: 12px; }
.legend.inline li { display: flex; gap: 6px; }
.clickable { cursor: pointer; }
.hbars, .stacked { display: flex; flex-direction: column; gap: 7px; }
.hbar-row { display: grid; grid-template-columns: minmax(80px, 38%) 1fr 48px; gap: 8px; align-items: center; font-size: 12.5px; }
.hbar-row.clickable:hover .hbar-label { color: var(--accent); }
.hbar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 12px; border-radius: 0 4px 4px 0; background: transparent; display: block; position: relative; }
.hbar-row > .hbar-track:not(.stackbar) { background: var(--surface-2); }
.hbar-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar-track.stackbar { display: flex; gap: 2px; background: transparent; }
.seg-fill { height: 100%; min-width: 3px; }
.seg-fill:last-child { border-radius: 0 4px 4px 0; }
.hbar-val { text-align: right; color: var(--muted); }
.vbars { width: 100%; height: auto; display: block; }
.vbars .grid { stroke: var(--line); stroke-width: 1; }
.vbars .baseline { stroke: var(--line-2); stroke-width: 1; }
.vbars .axis, .vbars .axis-x { font-size: 10px; fill: var(--muted); }
.vbars .muted-fill { fill: var(--muted); font-size: 9px; }
.vbars .bar-val { font-size: 10.5px; fill: var(--ink); font-weight: 600; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.clickable:hover td { background: var(--accent-soft); }
.tbl .r { text-align: right; }
.tbl tr.row-crit td:first-child { box-shadow: inset 3px 0 0 var(--critical); }
.tbl .actions { display: flex; gap: 4px; align-items: center; }
.tbl-mini { font-size: 11.5px; margin-top: 6px; border: 1px solid var(--line); }
.tbl-mini th, .tbl-mini td { padding: 4px 6px; position: static; }
.status-select { min-width: 140px; min-height: 30px !important; padding: 3px 6px !important; font-size: 12.5px; }
.matrix td.na { color: var(--muted); font-style: italic; font-size: 12px; }
.matrix th { position: static; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.empty b { color: var(--ink); display: block; margin-bottom: 4px; }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(7, 20, 34, .55); display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 10px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; max-height: calc(100dvh - 48px); }
.modal-wide { max-width: 760px; } .modal-xwide { max-width: 1080px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 10px 10px; }
.confirm-msg { margin: 0; }
.export-box { width: 100%; min-height: 280px; font-size: 11.5px; }

/* Toasts */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #fff; padding: 10px 14px; border-radius: var(--r); font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-left: 4px solid var(--sky); }
.toast-warn { border-left-color: #f0b44c; } .toast-crit { border-left-color: #ef5d56; background: #5c1210; } .toast-info { border-left-color: #8fa9c4; }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid.one { grid-template-columns: 1fr; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.span-2 { grid-column: span 2; } .span-3 { grid-column: 1 / -1; }
.field-label { font-size: 12px; font-weight: 600; color: var(--ink); }
.req { color: var(--critical); font-style: normal; margin-left: 3px; }
.field-error { color: var(--critical); font-size: 12px; }
.field-hint { color: var(--muted); font-size: 11.5px; }
.has-error input, .has-error select, .has-error textarea, .num-in.bad { border-color: var(--critical) !important; }
.dup-warn { display: flex; gap: 10px; background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--r); padding: 10px 12px; font-size: 13px; }
.dup-warn .ico { color: var(--warn); }

ors not closing.","Find and stop the moisture source first; check board grade (moisture-resistant or not).","Replacement of one swollen panel or base.","Carcass replacement over a cabinet run.","Not normally critical."),D6:x("D","Cabinet carcass damage","cabinetry","Loose joints, racked carcass, broken shelves, detached wall cabinets.","Check carcass joints, wall fixings and hanging rails against the loads stored.","Re-fixing joints or shelves.","Carcass or full cabinet replacement.","Wall-hung cabinet pulling away from the wall with risk of falling."),D7:x("D","Wardrobe defects","cabinetry","Sliding doors jumping, hanging rods sagging, shelves dropping, panels damaged.","Check track and roller condition, rod supports and shelf pins.","Hardware repair or replacement.","Wardrobe replacement.","Tall wardrobe unstable or not anchored, with tipping risk."),D8:x("D","Countertop defects","cabinetry","Chips, cracks, open seams, stains, failed silicone at backsplash, sagging overhangs.","Identify material (granite, quartz, solid surface, laminate); check support and seams; check for water ingress into the cabinet below.","Seam re-sealing, chip or crack repair.","Countertop replacement.","Heavy stone overhang cracked with risk of breaking off."),D9:x("D","Built-in furniture defects","cabinetry","Misaligned panels, loose shelves, damaged vanities or mirror cabinets.","Check fixing to walls, alignment and hardware; check moisture exposure in bathrooms.","Re-fixing, alignment and hardware replacement.","Unit replacement.","Heavy built-in units detaching from the wall."),E1:x("E","Faucet leakage","plumbing","Dripping spout, leaking at the handle or base, stiff handle, low flow.","Isolate water; check cartridge, washers, aerator and connections; confirm brand and model for parts.","Cartridge, washer or faucet replacement.","Not normally major.","Not normally critical."),E2:x("E","P-trap leakage","plumbing","Water under the sink or lavatory, odor, wet cabinet base.","Fill and drai e basin, cracked basin, failed sealant, faulty pop-up, leaking waste.","Check brackets, sealant, waste connection and basin condition.","Re-sealing, bracket re-fixing or pop-up replacement.","Basin, sink or fixture set replacement.","Cracked basin about to break with sharp edges."),E9:x("E","Shower fixture defects","plumbing","Leaking mixer, faulty diverter, poor spray, water heater not heating.","Check mixer cartridge, diverter and supply pressure; for heaters check electrical supply, earthing and protection.","Cartridge, diverter or shower set replacement.","Concealed mixer body replacement requiring tile removal.","Water heater with exposed wiring, tripping with water ingress or electric shock felt."),E10:x("E","Water pressure problems","plumbing","Low flow at fixtures, fluctuating pressure, noisy pipes, pump cycling.","Measure pressure at fixtures; check strainers, valves and the pump or tank; check building supply.","Clearing strainers, valve adjustment or pump servicing.","Pipe replacement or pump replacement.","Not normally critical."),F1:x("F","Silicone deterioration","waterproofing","Black or moldy sealant, gaps, peeling sealant at wet-area joints.","Check joint width and substrate; identify water passing behind the joint.","Removing and replacing sealant at localized joints.","Not normally major.","Not normally critical."),F2:x("F","Bathroom leakage","waterproofing","Water stains on the ceiling below, damp walls outside the bathroom, efflorescence, musty odor.","Flood test for 24\u201348 hours; separate plumbing leaks from waterproofing leaks; moisture map adjacent rooms.","Localized sealing without removing tiles.","Removal of tiles and waterproofing rehabilitation of the bathroom.","Leakage reaching electrical installations or causing ceiling sagging below."),F3:x("F","Shower area seepage","waterproofing","Damp wall behind the shower, wet threshold, stains outside the shower curb.","Separate shower wall and floor tests; check curb, threshold and drain.", ning smell.","Isolate immediately; thermal scan where available; check load and terminations.","Not applicable: overheating is treated as critical until made safe.","Rewiring of affected circuits after make-safe.","Any confirmed overheating is critical."),G8:x("G","Wiring defects","electrical","Exposed or damaged wires, undersized cables, improper splices, no earthing.","Isolate; trace and test circuits; insulation resistance and continuity tests; compare with the Philippine Electrical Code.","Accessible splice or termination correction.","Rewiring of circuits or the unit.","Exposed live conductors or damaged insulation within reach."),G9:x("G","Distribution panel defects","electrical","Missing directory, loose busbar or neutral, burning smell, heat, missing covers.","Isolate the main; check terminations, breaker ratings, labeling and covers; thermal scan where available.","Labeling or termination correction.","Panel replacement.","Burning smell, heat or arcing at the panel, or exposed live parts."),G10:x("G","Exhaust fan defects","electrical","Fan not running, noisy, weak extraction, backdraft.","Check supply, motor, duct connection and damper.","Fan repair or replacement.","Not normally major.","Fan motor overheating or burning smell."),H1:x("H","Mirror detachment","glazing","Mirror moving or tilting, adhesive failure, missing clips.","Check fixing (adhesive, clips, cleats) against mirror size and weight.","Re-fixing a small mirror with clips or approved adhesive.","Not normally major.","Heavy or large mirror detaching with risk of falling."),H2:x("H","Mirror cracks","glazing","Cracked or desilvered mirror, black edges.","Check stability; check moisture exposure at edges.","Mirror replacement.","Not normally major.","Cracked mirror unstable on the wall."),H3:x("H","Glass scratches","glazing","Visible scratches or scuffs on glass surfaces.","Assess depth (fingernail test) and position under standard viewing distance.","Polishing light scratches.","Pane replacement ings.","Not normally major.","Heavy wall-mounted items pulling out with risk of falling.")},ue={painting:{label:"Painting and wall finishes",items:[["Surface properly prepared (cleaned, filled, sanded, primed)",1],["Moisture source resolved and substrate dry before coating",1],["No visible unevenness, patchiness or roller marks",1],["No paint peeling, blistering or cracking",1],["Color and finish consistent with approved specification",1],["Surrounding surfaces protected and cleaned",0],["Final inspection completed with the unit owner or representative",1]]},tiling:{label:"Tiling and screed",items:[["Tile alignment consistent with existing layout",1],["No unacceptable lippage (straightedge check)",1],["No loose or hollow tiles on tap test",1],["Grout properly applied, full and uniform",1],["Tile color and batch match approved sample",0],["No damaged adjacent tiles",1],["Slope to drains verified in wet areas",0],["Final cleaning completed",0]]},flooring:{label:"Resilient and laminate flooring",items:[["Subfloor moisture and flatness verified before installation",1],["Planks fully engaged with no gaps or peaking",1],["Expansion gaps maintained at walls and thresholds",1],["Product and batch match the existing floor",0],["Skirting and transition strips refitted securely",1],["Final cleaning completed",0]]},carpentry:{label:"Carpentry, panels and trims",items:[["Panels and trims securely fixed to substrate",1],["Alignment, joints and reveals consistent",1],["No exposed sharp edges or protruding fixings",1],["Finish matches approved specification",0],["Adjacent finishes made good",0]]},doors:{label:"Doors and frames",items:[["Door operates smoothly without rubbing or binding",1],["Gaps even on all sides within tolerance",1],["Latch and lock engage correctly; all keys tested",1],["Hinges and closer secure with all screws in place",1],["Frame plumb, square and securely fixed",1],["Finish and trims made good",0]]},cabinetry:{label:"Cabinetry and joinery",items:[["Hinges pro hy finish after repairs.","Confirm the leak source is fixed and the board is dry, apply stain-blocking primer, repaint the full ceiling plane.",{src:25,sp:"Medium",common:"Paint defects"}],["A2","Paint blistering repair","Minor","Painter",2500,7e3,"4\u20136 hrs","P4","Bubbles or blisters in the paint film, usually from trapped moisture.","Painting over damp plaster; vapor from wet areas; heat exposure.","Measure substrate moisture, cut out blisters, let the area dry, apply alkali-resistant primer and repaint to the break line.",{common:"Paint defects",scale:"Full room repainting"}],["A2","Efflorescence treatment","Minor","Painter/Mason",2500,8e3,"1 day","P3","White salt deposits pushing through paint on masonry walls.","Moisture migrating through masonry; wet-area leaks; rising damp.","Identify and stop the moisture path, brush off salts, treat with efflorescence remover, apply alkali-resistant sealer and repaint.",{scale:"Rising damp / wall dampness treatment"}],["A2","Localized mold and mildew remediation","Minor","Painter",3e3,9e3,"1 day","P3","Dark mold spots on walls or ceilings, often in bathrooms, closets and behind furniture.","Condensation; poor ventilation; hidden leaks.","Fix ventilation or leak causes, treat with fungicidal wash, allow to dry, prime with anti-mold primer and repaint.",{}],["A2","Uneven paint finish / color mismatch correction","Minor","Painter",2e3,6e3,"4\u20136 hrs","P4","Roller marks, sheen differences, flashing or color mismatch between patched and existing areas.","Different paint batches; inconsistent application; touch-ups not carried to break lines.","Verify the approved color code and sheen, repaint the full wall face corner to corner.",{common:"Paint defects"}],["A3","Hollow / debonded plaster repair (localized)","Minor","Mason",3e3,9e3,"1 day","P3","Plaster sounding hollow or bulging in an area under about 1 m\xB2.","Poor bonding to substrate; plastering over dusty block; thick single-coat application.","Mark extent by tap test, hack off debonded plaster, apply bonding agent, re-plaster in layers, cure, skim and repaint.",{scale:"Extensive plaster re-rendering"}],["A3","Extensive plaster re-rendering","Major","Mason/Painter",18e3,55e3,"3\u20135 days","P3","Re-plastering of whole wall faces where plaster has debonded over large areas.","Systemic bonding failure; wrong mix; inadequate curing.","Hack off plaster to sound substrate, check embedded conduits, apply bonding coat, re-render, cure at least 7 days, skim, prime and repaint.",{}],["A3","Plaster corner and edge spalling repair","Minor","Mason/Painter",1500,5e3,"3\u20134 hrs","P4","Chipped or broken plaster at external corners, openings and edges.","Impact damage; missing corner beads.","Cut back to sound plaster, install corner bead where needed, re-plaster, skim and repaint.",{}],["A4","Gypsum patch repair","Minor","Carpenter",3e3,7e3,"4 hrs","P3","Patching of dents and holes in gypsum board walls or ceilings.","Impact damage; removal of fixtures; small water damage.","Cut out the damaged section to a regular shape, install backing, fix new board, tape and joint compound, sand, prime and repaint.",{src:5,sp:"Medium"}],["A4","Gypsum board joint and screw-pop correction","Minor","Carpenter/Painter",1500,5e3,"3\u20134 hrs","P4","Visible board joints, tape lines or screw heads popping through the finish.","Framing movement; screws over-driven; insufficient compound.","Re-fix boards with additional screws, remove popped screws, re-tape joints, apply compound in three coats, sand and repaint.",{}],["A4","Water-damaged gypsum wall board replacement","Major","Carpenter/Painter",12e3,35e3,"2\u20133 days","P2","Replacement of gypsum wall boards that are soft, stained or moldy from water exposure.","Plumbing leaks inside partitions; wet-area seepage; AC leaks.","Fix the water source first, remove wet boards and insulation, dry and treat framing, install moisture-resistant board, finish and repaint.",{}],["A4","Interior partition repair","Major","Carpenter",15e3,6e4,"2 days","P2","Repair or rebuild of gypsum or light-gauge partition walls.","Impact damage; framing failure; water damage.","Remove damaged boards and framing, rebuild with correct stud spacing and fixings, reinstall boards, finish and repaint; coordinate concealed services.",{src:50,crc:["CRC-M13"],sp:"High"}],["A5","Ceiling joint crack repair","Minor","Painter/Carpenter",2e3,6e3,"4 hrs","P3","Cracks along gypsum ceiling board joints or at the wall-ceiling line.","Gypsum movement; missing joint tape; framing movement.","Check and re-fix framing at the joint, re-tape with paper or mesh tape, apply jointing compound, sand and repaint the ceiling plane.",{src:4,crc:["CRC-m03"],sp:"Medium",common:"Ceiling cracks",scale:"Gypsum ceiling replacement"}],["A5","Gypsum ceiling replacement","Major","Carpenter",15e3,5e4,"1\u20132 days","P2","Replacement of damaged gypsum ceiling boards over a room or large area.","Water damage; sagging; extensive cracking.","Isolate lighting circuits, remove damaged boards, inspect and correct framing, install new boards, tape and joint, reinstall fixtures and repaint.",{src:24,crc:["CRC-M02"],sp:"High",common:"Ceiling cracks"}],["A5","Ceiling access panel repair / replacement","Minor","Carpenter",1500,4500,"2\u20133 hrs","P3","Access panels that are misaligned, sagging, not closing or damaged.","Frequent opening; poor framing around panel; wrong panel size.","Frame the opening properly, replace or adjust the panel and hinges, fill gaps and repaint.",{}],["A5","Water-stained ceiling patch (after leak repair)","Minor","Carpenter/Painter",3e3,8e3,"4\u20136 hrs","P3","Localized stain or soft spot on a ceiling after the leak source has been fixed.","Leak from unit above; AC drain; plumbing.","Confirm the source is fixed and dry, replace the soft board section if needed, apply stain-blocking primer and repaint the ceiling plane.",{scale:"Gypsum ceiling replacement"}],["A5","Sagging ceiling make-safe and replacement","Critical","Carpenter/Electrician",15e3,6e4,"1\u20133 days","P1","Ceiling visibly sagging, bulging with water or with detached boards, with risk of collapse.","Water accumulation above the ceiling; failed hangers; overloaded framing.","Clear and cordon the area, isolate lighting circuits, puncture to release trapped water if safe, remove failed boards, repair framing and hangers, reinstall boards and finishes.",{}],["A5","Ceiling framing realignment","Major","Carpenter",15e3,45e3,"2\u20133 days","P3","Uneven or wavy ceiling lines from misaligned metal furring or hangers.","Poor installation; hangers not adjusted; framing movement.","Open sections, re-level framing with a laser, add hangers, refix boards, tape and joint, repaint.",{}],["A6","Cornice / molding joint separation repair","Minor","Carpenter/Painter",1500,4500,"2\u20134 hrs","P4","Gaps at cornice joints or between molding and the wall or ceiling.","Shrinkage; poor adhesive; building movement.","Clean joints, re-fix with adhesive and pins, fill with flexible filler, sand and repaint.",{}],["A6","Detached or damaged cornice replacement","Minor","Carpenter/Painter",3e3,9e3,"1 day","P3","Cornice lengths cracked, broken or detached.","Impact; adhesive failure; moisture.","Remove damaged lengths, source matching profile, fix with adhesive and mechanical fixings, joint and repaint.",{}],["A7","Wall panel repair","Major","Carpenter",1e4,4e4,"1\u20132 days","P3","Repair of damaged wall panel areas including replacement of affected panels and substrate.","Panel damage; impact; moisture; adhesive failure.","Remove damaged panels, repair substrate and furring, install matching panels, align joints and finish trims.",{src:49,sp:"Medium"}],["A7","Loose wall panel re-fixing","Minor","Carpenter",2e3,6e3,"3\u20134 hrs","P3","Individual panels loose, bowing or separating from the wall.","Adhesive failure; insufficient fixings; substrate movement.","Remove the panel, clean substrate, re-fix with adhesive and concealed mechanical fixings, realign joints.",{scale:"Wall panel repair"}],["A7","Feature panel section replacement","Minor","Carpenter",4e3,1e4,"1 day","P4","Replacement of a few scratched, dented or discolored fluted, WPC or veneer panels.","Impact; UV discoloration; batch mismatch.","Source matching panels, remove damaged panels without disturbing neighbors, install and align.",{scale:"Wall panel repair"}],["A8","Wallpaper seam lifting re-adhesion","Minor","Painter",1e3,3500,"2\u20133 hrs","P4","Wallpaper seams opening or edges peeling.","Insufficient adhesive; humidity; poor wall priming.","Clean the seam, apply seam adhesive, roll flat, wipe excess.",{}],["A8","Wallpaper drop replacement","Minor","Painter",4e3,1e4,"4\u20136 hrs","P4","Replacement of stained, bubbled or damaged wallpaper drops on one wall.","Moisture; stains; bubbles from poor application.","Check wall moisture, strip affected drops, prime, hang matching batch drops with pattern alignment.",{scale:"Full room wallpaper replacement"}],["A8","Full room wallpaper replacement","Major","Painter",15e3,45e3,"2\u20133 days","P4","Replacement of wallpaper throughout a room.","Widespread mold; batch mismatch; adhesive failure.","Strip existing paper, treat walls for moisture and mold, skim and prime, hang new paper.",{}],["B1","Hollow tile replacement (localized)","Minor","Mason",2500,7e3,"4\u20136 hrs","P3","Replacement of up to about five hollow-sounding floor tiles in one area.","Insufficient adhesive coverage; spot bedding; substrate not wetted.","Cut out grout, lift hollow tiles, clean adhesive and substrate, re-lay with full-bed adhesive using matching tiles, re-grout.",{common:"Tile hollowing / loose tiles",scale:"Floor tile replacement (room)"}],["B1","Floor tile replacement (room)","Major","Mason",2e4,8e4,"2\u20133 days","P2","Removal and reinstallation of floor tiles over a whole room.","Installation defect; widespread hollowing; substrate failure.","Remove furniture, lift tiles, inspect and repair screed, re-lay tiles with full-bed adhesive and movement joints, re-grout, reinstall skirting.",{src:26,crc:["CRC-M03"],sp:"High",common:"Tile hollowing / loose tiles"}],["B1","Tile tenting / popping repair","Major","Mason",15e3,5e4,"2\u20133 days","P2","Tiles suddenly lifting into a tent shape or popping with a cracking sound.","No movement joints; thermal expansion; adhesive failure.","Cordon the area, lift affected tiles, introduce perimeter and field movement joints, re-lay with full-bed adhesive.",{common:"Tile hollowing / loose tiles"}],["B2","Loose tile reset","Minor","Mason",2e3,5e3,"3 hrs","P3","Resetting isolated loose floor or wall tiles.","Poor adhesive bond; substrate movement.","Remove the loose tile and old adhesive, re-lay with suitable adhesive, re-grout and clean.",{src:7,sp:"Medium",common:"Tile hollowing / loose tiles",scale:"Floor tile replacement (room)"}],["B2","Loose wall tile re-fixing","Minor","Mason",2500,7e3,"4\u20136 hrs","P2","Wall tiles drumming, bulging or detaching, especially in wet areas.","Adhesive failure; water behind tiles; heavy tiles on unsuitable substrate.","Remove loose tiles, check waterproofing and substrate, re-fix with polymer-modified adhesive, re-grout and seal.",{scale:"Bathroom tile replacement"}],["B3","Broken tile replacement","Minor","Mason",2e3,6e3,"4 hrs","P3","Replacement of one to five cracked or broken floor or wall tiles.","Impact damage; point loads; hollow bedding.","Cut out grout, break out the tile carefully, clean the bed, set a matching tile with full adhesive, re-grout and clean.",{src:8,crc:["CRC-m04"],sp:"Medium",scale:"Floor tile replacement (room)"}],["B3","Chipped tile edge repair","Minor","Mason",800,2500,"1\u20132 hrs","P4","Small chips at tile edges or corners.","Impact; lippage edges catching loads.","Fill with color-matched epoxy tile repair compound, level and polish.",{}],["B4","Tile lippage correction (localized)","Minor","Mason",3e3,8e3,"1 day","P3","Uneven edges between adjacent tiles in a localized area." ovide temporary securing if the entrance cannot be locked.",{sup:1}],["C4","Door hinge replacement / tightening","Minor","Carpenter",800,2500,"1\u20132 hrs","P3","Hinges loose, squeaking, bent or broken.","Stripped screw holes; undersized hinges; door weight.","Plug stripped holes, fit longer screws, replace hinges with correct size and number.",{}],["C4","Door closer adjustment / replacement","Minor","Carpenter",1500,6e3,"1\u20132 hrs","P3","Closer slamming, leaking oil or not closing the door.","Wrong adjustment; worn unit.","Adjust closing and latching speeds or replace with a closer rated for the door size.",{}],["C5","Sliding door repair","Minor","Carpenter",2e3,6e3,"2 hrs","P3","Repair of sliding door rollers and guides.","Roller failure; track debris; misalignment.","Lift door, replace rollers and guides, clean track, adjust height and lock alignment.",{src:44,sp:"Medium",scale:"Sliding door replacement"}],["C5","Sliding door replacement","Major","Carpenter",15e3,5e4,"2 days","P2","Replacement of a sliding door panel or system.","Frame damage; repeated failure.","Remove the door system, repair the opening, install new frame, panels and hardware, seal and test.",{src:45,sp:"High"}],["C5","Sliding track cleaning and roller adjustment","Minor","Carpenter",800,2500,"1\u20132 hrs","P3","Sliding door heavy or noisy without broken parts.","Debris in track; roller height not adjusted.","Clean and lubricate track, adjust roller height, check anti-lift blocks.",{}],["C6","Door frame repair","Major","Carpenter",5e3,15e3,"1 day","P3","Repair or realignment of a door frame.","Frame misalignment; loose fixings.","Remove casing, re-fix and re-plumb the frame, pack and anchor, reinstall casing, make good paint.",{src:36,sp:"Medium"}],["C6","Door jamb / casing gap and trim repair","Minor","Carpenter/Painter",1e3,3500,"2\u20133 hrs","P4","Gaps between casing and wall or open miters.","Shrinkage; uneven walls.","Re-fix casing, fill gaps and miters, sand and refinish.",{}],["C6" .rpt{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#14202e;background:#fff;font-size:12.5px;line-height:1.5}
.rpt *{box-sizing:border-box}
.rpt .r-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid #0e2a47;padding-bottom:10px;margin-bottom:14px}
.rpt .r-brand b{display:block;font-family:Archivo,'Arial Narrow',sans-serif;font-weight:800;letter-spacing:.14em;font-size:20px;color:#0e2a47}
.rpt .r-brand span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#2f7fc1}
.rpt .r-meta{text-align:right;font-size:11px;color:#4d5d6e}
.rpt h1{font-family:Archivo,'Arial Narrow',sans-serif;font-size:19px;margin:0 0 2px;color:#0e2a47;text-wrap:balance}
.rpt h2{font-family:Archivo,'Arial Narrow',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#0e2a47;border-bottom:1px solid #d5dee8;padding-bottom:3px;margin:18px 0 8px}
.rpt table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:11.5px}
.rpt th,.rpt td{border:1px solid #d5dee8;padding:5px 7px;text-align:left;vertical-align:top}
.rpt th{background:#eef3f8;color:#0e2a47;font-weight:600}
.rpt td.r,.rpt th.r{text-align:right;font-variant-numeric:tabular-nums}
.rpt .kv{display:grid;grid-template-columns:170px 1fr;gap:3px 12px;margin:0}
.rpt .kv dt{color:#4d5d6e}.rpt .kv dd{margin:0}
.rpt .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#fff}
.rpt .t-minor{background:#23804f}.rpt .t-major{background:#c4620e}.rpt .t-critical{background:#b82a26}
.rpt .t-p{background:#fff;border:1.5px solid #4a2a9c;color:#4a2a9c}
.rpt .callout{border:1.5px solid #b82a26;background:#fdf1f0;padding:8px 10px;border-radius:4px;margin:8px 0}
